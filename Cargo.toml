[workspace]
members = [
    "crates/*",
    "xtask",
]
# `xtask` is development tooling: plain `cargo build` / `cargo test` at the root skip it.
default-members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Roland Tepp"]
license = "MIT OR Apache-2.0"
description = "A Java Language Server Protocol implementation in Rust"

[workspace.dependencies]
# External crates
anyhow = "1"
clap = { version = "4", features = ["derive"] }
expect-test = "1"
ignore = "0.4"
la-arena = "0.3"
line-index = "0.1"
lsp-server = "0.10"
lsp-types = "0.97"
rowan = "0.17"
roxmltree = "0.21"
rustc-hash = "2"
salsa = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
smol_str = "0.3"
tempfile = "3"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

# Workspace crates
syntax = { path = "crates/syntax" }
hir = { path = "crates/hir" }
ide = { path = "crates/ide" }
