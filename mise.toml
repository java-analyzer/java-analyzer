[tools]
ast-grep = "latest"
fd = "latest"
jq = "latest"
jujutsu = "latest"
node = "lts"
ripgrep = "latest"
xh = "latest"
yq = "latest"

[tasks.conformance-fetch]
description = "Download and unpack pinned Java corpora using xh"
run = '''
#!/usr/bin/env bash
set -euo pipefail

corpus_dir="target/conformance/corpus"
mkdir -p "$corpus_dir"

tmp_root="$(mktemp -d "${TMPDIR:-/tmp}/java-corpus.XXXXXX")"
trap 'rm -rf "$tmp_root"' EXIT

fetch_tarball() {
  local id="$1"
  local url="$2"
  local subdir="$3"
  local dest="$corpus_dir/$id"
  local archive="$tmp_root/$id.tar.gz"

  if [ -d "$dest" ] && [ "${FORCE:-0}" != "1" ]; then
    echo "cached: $id ($dest)"
    return 0
  fi

  echo "[conformance] fetching $id..." >&2
  xh --quiet --ignore-stdin --download --follow --check-status --output "$archive" GET "$url" Accept-Encoding:gzip

  local stage="$tmp_root/$id"
  mkdir -p "$stage"
  tar -xzf "$archive" -C "$stage"
  rm -f "$archive"

  local top
  top="$(find "$stage" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
  if [ ! -d "$top/$subdir" ]; then
    echo "error: expected $subdir inside $id archive" >&2
    return 1
  fi

  rm -rf "$dest"
  mv "$top/$subdir" "$dest"
  echo "[conformance] ready: $id" >&2
}

pids=()
fetch_tarball \
  "commons-lang" \
  "https://github.com/apache/commons-lang/archive/refs/tags/rel/commons-lang-3.17.0.tar.gz" \
  "src/main/java" &
pids+=($!)

fetch_tarball \
  "jackson-core" \
  "https://github.com/FasterXML/jackson-core/archive/refs/tags/jackson-core-2.18.2.tar.gz" \
  "src/main/java" &
pids+=($!)

fetch_tarball \
  "guava" \
  "https://github.com/google/guava/archive/refs/tags/v33.4.0.tar.gz" \
  "guava/src" &
pids+=($!)

fetch_tarball \
  "google-java-format" \
  "https://github.com/google/google-java-format/archive/refs/tags/v1.24.0.tar.gz" \
  "core/src/main/java" &
pids+=($!)

status=0
for pid in "${pids[@]}"; do
  if ! wait "$pid"; then
    status=1
  fi
done
exit "$status"
'''

[tasks.conformance-fetch-jdk]
description = "Download and unpack OpenJDK source tree (arg or JDK_VERSION: latest|lts|<N>|<tag>)"
run = '''
#!/usr/bin/env bash
set -euo pipefail

spec="${1:-${JDK_TAG:-${JDK_VERSION:-latest}}}"
case "$spec" in
  latest)
    ver="$(xh --ignore-stdin --body --check-status GET https://api.adoptium.net/v3/info/available_releases | jq -r '.most_recent_feature_release')"
    jdk_tag="jdk-${ver}-ga"
    ;;
  lts)
    ver="$(xh --ignore-stdin --body --check-status GET https://api.adoptium.net/v3/info/available_releases | jq -r '.most_recent_lts')"
    jdk_tag="jdk-${ver}-ga"
    ;;
  *[!0-9]*)
    jdk_tag="$spec"
    ;;
  *)
    jdk_tag="jdk-${spec}-ga"
    ;;
esac

jdk_dir="target/conformance/jdk"
dest="$jdk_dir/$jdk_tag"
mkdir -p "$jdk_dir"

if [ -d "$dest" ] && [ "${FORCE:-0}" != "1" ]; then
  echo "cached: $jdk_tag ($dest)"
  exit 0
fi

tmp_root="$(mktemp -d "${TMPDIR:-/tmp}/java-corpus-jdk.XXXXXX")"
trap 'rm -rf "$tmp_root"' EXIT
archive="$tmp_root/$jdk_tag.tar.gz"

url="https://github.com/openjdk/jdk/archive/refs/tags/${jdk_tag}.tar.gz"
echo "[conformance] fetching $jdk_tag..." >&2
xh --quiet --ignore-stdin --download --follow --check-status --output "$archive" GET "$url" Accept-Encoding:gzip

# Extract only src/ so tests and build scripts don't bloat disk or skew valid-only results.
top_dir="jdk-${jdk_tag//+/-}"
tar -xzf "$archive" -C "$tmp_root" "$top_dir/src"
rm -f "$archive"

if [ ! -d "$tmp_root/$top_dir/src" ]; then
  echo "error: expected $top_dir/src inside $jdk_tag archive" >&2
  exit 1
fi

rm -rf "$dest"
mv "$tmp_root/$top_dir/src" "$dest"
echo "unpacked: $jdk_tag -> $dest"
'''

[tasks.conformance]
description = "Fetch library corpora and run parser conformance checks"
depends = ["conformance-fetch"]
run = '''
#!/usr/bin/env bash
set -euo pipefail

cleanup() {
  rm -rf target/conformance/archives target/conformance/corpus
}
trap cleanup EXIT

corpus_dir="target/conformance/corpus"
args=()
for dir in "$corpus_dir"/*; do
  if [ -d "$dir" ]; then
    args+=(--valid "$dir")
  fi
done

if [ -z "${args[*]:-}" ]; then
  echo "error: no corpora found in $corpus_dir" >&2
  exit 1
fi

cargo xtask conformance "${args[@]}" --out target/conformance
'''

[tasks.conformance-jdk]
description = "Fetch library corpora + OpenJDK (arg or JDK_VERSION: latest|lts|<N>|<tag>) and run conformance"
run = '''
#!/usr/bin/env bash
set -euo pipefail

jdk_log="$(mktemp "${TMPDIR:-/tmp}/java-corpus-jdk-log.XXXXXX")"
cleanup() {
  rm -rf target/conformance/archives target/conformance/corpus target/conformance/jdk "$jdk_log"
}
trap cleanup EXIT

mise run conformance-fetch &
pid_libs=$!
mise run conformance-fetch-jdk "$@" > "$jdk_log" &
pid_jdk=$!

status=0
wait "$pid_libs" || status=1
wait "$pid_jdk" || status=1
if [ "$status" -ne 0 ]; then
  cat "$jdk_log" >&2
  exit "$status"
fi

jdk_path="$(sed -nE 's/^.*(cached|unpacked): [^ ]+ (-> )?\(?([^)]+)\)?$/\3/p' "$jdk_log" | tail -n 1)"

if [ -z "$jdk_path" ] || [ ! -d "$jdk_path" ]; then
  echo "error: could not locate unpacked JDK corpus" >&2
  exit 1
fi

args=()
for dir in target/conformance/corpus/*; do
  if [ -d "$dir" ]; then
    args+=(--valid "$dir")
  fi
done
args+=(--valid "$jdk_path")

cargo xtask conformance "${args[@]}" --out target/conformance
'''

[tasks.workspace-corpus]
description = "Fetch, inspect, and clean up real-world Java repos in parallel (CORPUS_JOBS=4, optional filter args)"
run = '''
#!/usr/bin/env bash
set -euo pipefail

cargo build --release -p java-analyzer

bin="target/release/java-analyzer"
out_dir="target/workspace-corpus"
mkdir -p "$out_dir"

tmp_root="$(mktemp -d "${TMPDIR:-/tmp}/java-workspace-corpus.XXXXXX")"
mkdir -p "$tmp_root/timings"
trap 'rm -rf "$tmp_root"' EXIT

repos=(
  "commons-lang|apache/commons-lang"
  "gson|google/gson"
  "junit-framework|junit-team/junit-framework"
  "ant-ivy|apache/ant-ivy"
  "ant|apache/ant"
  "tomcat|apache/tomcat"
  "bach|sormuras/bach"
  "jbang-catalog|jbangdev/jbang-catalog"
  "checkstyle|checkstyle/checkstyle"
  "jackson-core|FasterXML/jackson-core"
  "error-prone|google/error-prone"
  "jfx|openjdk/jfx"
)

should_run() {
  local id="$1"
  if [ "$#" -lt 2 ]; then
    return 0
  fi
  shift
  for f in "$@"; do
    if [ "$f" = "$id" ]; then
      return 0
    fi
  done
  return 1
}

process_repo() {
  local id="$1"
  local slug="$2"
  local stage="$tmp_root/$id"
  local archive="$tmp_root/$id.tar.gz"
  mkdir -p "$stage"

  local url="https://github.com/${slug}/archive/HEAD.tar.gz"
  xh --quiet --ignore-stdin --download --follow --check-status --output "$archive" GET "$url" Accept-Encoding:gzip

  tar -xzf "$archive" -C "$stage"
  rm -f "$archive"

  local repo_dir
  repo_dir="$(fd --type d --max-depth 1 . "$stage" | head -n 1)"
  if [ -z "$repo_dir" ] || [ ! -d "$repo_dir" ]; then
    echo "error: failed to locate unpacked directory for $id" >&2
    rm -rf "$stage"
    return 1
  fi

  local start_ms end_ms elapsed_ms
  start_ms="$(python3 -c 'import time; print(int(time.time() * 1000))')"
  "$bin" inspect --json --show-errors "$repo_dir" > "$out_dir/$id.json"
  end_ms="$(python3 -c 'import time; print(int(time.time() * 1000))')"
  elapsed_ms="$((end_ms - start_ms))"
  printf '%s\n' "$elapsed_ms" > "$tmp_root/timings/$id.ms"

  rm -rf "$stage"
  echo "[workspace-corpus] $id done (${elapsed_ms}ms)" >&2
}

jobs="${CORPUS_JOBS:-4}"
selected_ids=()
pids=()
active=0
status=0

for entry in "${repos[@]}"; do
  id="${entry%%|*}"
  slug="${entry#*|}"
  if ! should_run "$id" "$@"; then
    continue
  fi
  selected_ids+=("$id")

  process_repo "$id" "$slug" &
  pids+=($!)
  active=$((active + 1))

  if [ "$active" -ge "$jobs" ]; then
    if ! wait -n; then
      status=1
    fi
    active=$((active - 1))
  fi
done

for pid in "${pids[@]}"; do
  if ! wait "$pid"; then
    status=1
  fi
done

if [ "$status" -ne 0 ]; then
  exit "$status"
fi

timing_file="$out_dir/timings.tsv"
: > "$timing_file"
for id in "${selected_ids[@]}"; do
  ms="$(cat "$tmp_root/timings/$id.ms")"
  printf '%s\t%s\n' "$id" "$ms" >> "$timing_file"
done

echo ""
{
  printf 'Repo\tBuild\tRelease\tModules\tFiles\tTypes\tParse Errors\tPkg Mismatches\tConflicts\tTime (ms)\n'
  while IFS=$'\t' read -r id ms; do
    jq -r --arg id "$id" --arg ms "$ms" '
      "\($id)\t\(.active_build_tool)\tJava \(.active_language_level.release)\t\(.modules | length)\t\(.health.total_java_files)\t\(.health.indexed_types)\t\(.health.files_with_parse_errors)\t\(.package_mismatches | length)\t\(.conflicts | length)\t\($ms)"
    ' "$out_dir/$id.json"
  done < "$timing_file"
} | awk -F'\t' '
  {
    for (i = 1; i <= NF; i++) {
      rows[NR, i] = $i
      if (length($i) > w[i]) w[i] = length($i)
    }
    cols = NF
  }
  END {
    for (r = 1; r <= NR; r++) {
      for (i = 1; i <= cols; i++) {
        sep = (i == cols) ? "\n" : "  "
        if (i <= 3) printf "%-*s%s", w[i], rows[r, i], sep
        else printf "%*s%s", w[i], rows[r, i], sep
      }
      if (r == 1) {
        for (i = 1; i <= cols; i++) {
          sep = (i == cols) ? "\n" : "  "
          dash = ""
          for (j = 0; j < w[i]; j++) dash = dash "-"
          printf "%s%s", dash, sep
        }
      }
    }
  }
'
'''

[tasks.conformance-report]
description = "Run all verification tiers (in parallel where possible) and generate CONFORMANCE.md"
run = '''
#!/usr/bin/env bash
set -euo pipefail

mkdir -p target/conformance

# Build release binaries once up front so parallel corpus runs don't contend on Cargo locks.
cargo build --release -p java-analyzer -p xtask

if cargo clippy --workspace --all-targets -- -D warnings; then
  clippy_status="pass"
else
  clippy_status="fail"
fi

cargo test --workspace --all-targets 2>&1 | tee target/conformance/test-output.txt || true

mise run conformance-jdk &
pid_conf=$!
mise run workspace-corpus &
pid_ws=$!

corpus_status=0
wait "$pid_conf" || corpus_status=1
wait "$pid_ws" || corpus_status=1
if [ "$corpus_status" -ne 0 ]; then
  exit "$corpus_status"
fi

if command -v jj >/dev/null 2>&1; then
  rev="$(jj log -r @- --no-graph -T 'change_id.shortest(8) ++ " (" ++ commit_id.shortest(8) ++ ", " ++ description.first_line() ++ ")"' 2>/dev/null || echo "unknown")"
else
  rev="unknown"
fi
[ -n "$rev" ] || rev="unknown"

cargo xtask report \
  --conformance target/conformance/report.json \
  --workspace-corpus target/workspace-corpus \
  --test-output target/conformance/test-output.txt \
  --clippy-status "$clippy_status" \
  --revision "$rev" \
  --out target/conformance/CONFORMANCE.md \
  "$@"
'''

[tasks.bench-fetch]
description = "Download and unpack pinned benchmark corpora and external Java LSPs using xh (SERVERS_ONLY=1, CORPORA_ONLY=1, FORCE=1, optional filter args)"
run = '''
#!/usr/bin/env bash
set -euo pipefail

corpus_dir="target/bench/corpus"
server_dir="target/bench/servers"
mkdir -p "$corpus_dir" "$server_dir"

tmp_root="$(mktemp -d "${TMPDIR:-/tmp}/java-bench-fetch.XXXXXX")"
trap 'rm -rf "$tmp_root"' EXIT

should_run() {
  local id="$1"
  shift
  if [ "$#" -eq 0 ]; then
    return 0
  fi
  for f in "$@"; do
    if [ "$f" = "$id" ]; then
      return 0
    fi
  done
  return 1
}

fetch_corpus() {
  local id="$1"
  local slug="$2"
  local tag="$3"
  local dest="$corpus_dir/$id"
  local archive="$tmp_root/$id.tar.gz"
  local url="https://github.com/${slug}/archive/refs/tags/${tag}.tar.gz"

  if [ -d "$dest" ] && [ "${FORCE:-0}" != "1" ]; then
    echo "cached: $id ($dest)"
    return 0
  fi

  echo "[bench-fetch] fetching corpus $id ($tag)..." >&2
  xh --quiet --ignore-stdin --download --follow --check-status --output "$archive" GET "$url" Accept-Encoding:gzip

  local stage="$tmp_root/corpus-$id"
  mkdir -p "$stage"
  tar -xzf "$archive" -C "$stage"
  rm -f "$archive"

  local top
  top="$(fd --no-ignore --type d --max-depth 1 . "$stage" | head -n 1)"
  top="${top%/}"
  if [ -z "$top" ] || [ ! -d "$top" ]; then
    echo "error: failed to locate unpacked directory for $id" >&2
    return 1
  fi

  rm -rf "$dest"
  mv "$top" "$dest"
  echo "[bench-fetch] ready: $id ($dest)" >&2
}

gen_plain_small() {
  local dest="$corpus_dir/plain-small"
  if [ -d "$dest" ] && [ "${FORCE:-0}" != "1" ]; then
    echo "cached: plain-small ($dest)"
    return 0
  fi

  echo "[bench-fetch] generating plain-small..." >&2
  rm -rf "$dest"
  if [ -x "target/release/xtask" ]; then
    target/release/xtask bench-gen-plain --out "$dest"
  else
    cargo run --release -p xtask -- bench-gen-plain --out "$dest"
  fi
  echo "[bench-fetch] ready: plain-small ($dest)" >&2
}

fetch_jdtls() {
  local dest="$server_dir/jdtls"
  local archive="$tmp_root/jdtls.tar.gz"
  local stage="$tmp_root/server-jdtls"
  local url="https://download.eclipse.org/jdtls/snapshots/jdt-language-server-latest.tar.gz"

  if [ -d "$dest" ] && [ "${FORCE:-0}" != "1" ]; then
    echo "cached: jdtls ($dest)"
    return 0
  fi

  echo "[bench-fetch] fetching server jdtls..." >&2
  xh --quiet --ignore-stdin --download --follow --check-status --output "$archive" GET "$url"
  mkdir -p "$stage"
  tar -xzf "$archive" -C "$stage"
  rm -f "$archive"

  local src_dir=""
  if [ -f "$stage/bin/jdtls" ]; then
    src_dir="$stage"
  else
    local sub
    sub="$(fd --no-ignore --type d --max-depth 1 . "$stage" | head -n 1)"
    sub="${sub%/}"
    if [ -n "$sub" ] && [ -f "$sub/bin/jdtls" ]; then
      src_dir="$sub"
    fi
  fi

  if [ -z "$src_dir" ]; then
    echo "[bench-fetch] warning: jdtls binary not found in archive" >&2
    return 1
  fi

  chmod +x "$src_dir/bin/jdtls"
  rm -rf "$dest"
  mv "$src_dir" "$dest"
  echo "[bench-fetch] ready: jdtls ($dest)" >&2
}

unpack_vsix() {
  local archive="$1"
  local stage="$2"
  mkdir -p "$stage"
  if gzip -t "$archive" 2>/dev/null; then
    gzip -dc "$archive" > "$archive.vsix"
    rm -f "$archive"
    unzip -q -o "$archive.vsix" -d "$stage"
    rm -f "$archive.vsix"
  else
    unzip -q -o "$archive" -d "$stage"
    rm -f "$archive"
  fi
}

fetch_jls() {
  local dest="$server_dir/jls"
  local archive="$tmp_root/jls.vsix"
  local stage="$tmp_root/server-jls"
  local url="https://marketplace.visualstudio.com/_apis/public/gallery/publishers/georgewfraser/vsextensions/vscode-javac/latest/vspackage"

  if [ -d "$dest" ] && [ "${FORCE:-0}" != "1" ]; then
    echo "cached: jls ($dest)"
    return 0
  fi

  echo "[bench-fetch] fetching server jls..." >&2
  xh --quiet --ignore-stdin --download --follow --check-status --output "$archive" GET "$url"
  unpack_vsix "$archive" "$stage"

  if [ ! -d "$stage/extension/dist" ]; then
    echo "[bench-fetch] warning: jls extension/dist not found in archive" >&2
    return 1
  fi

  chmod +x "$stage"/extension/dist/*.sh 2>/dev/null || true
  rm -rf "$dest"
  mv "$stage" "$dest"
  echo "[bench-fetch] ready: jls ($dest)" >&2
}

fetch_nbls() {
  local dest="$server_dir/nbls"
  local archive="$tmp_root/nbls.vsix"
  local stage="$tmp_root/server-nbls"

  if [ -d "$dest" ] && [ "${FORCE:-0}" != "1" ]; then
    echo "cached: nbls ($dest)"
    return 0
  fi

  echo "[bench-fetch] fetching server nbls..." >&2
  local download_url
  download_url="$(xh --ignore-stdin --body --check-status GET "https://open-vsx.org/api/oracle/oracle-java/latest" | jq -r '.files.download // empty')"
  if [ -z "$download_url" ]; then
    echo "[bench-fetch] warning: could not resolve nbls download URL from Open VSX" >&2
    return 1
  fi

  xh --quiet --ignore-stdin --download --follow --check-status --output "$archive" GET "$download_url"
  unpack_vsix "$archive" "$stage"

  local nbcode_bin=""
  if [ -f "$stage/extension/nbcode/bin/nbcode.sh" ]; then
    nbcode_bin="$stage/extension/nbcode/bin/nbcode.sh"
  elif [ -f "$stage/extension/nbcode/bin/nbcode" ]; then
    nbcode_bin="$stage/extension/nbcode/bin/nbcode"
  else
    echo "[bench-fetch] warning: nbls nbcode binary not found in archive" >&2
    return 1
  fi

  chmod +x "$nbcode_bin" 2>/dev/null || true
  chmod +x "$stage"/extension/nbcode/platform*/lib/nbexec 2>/dev/null || true
  rm -rf "$dest"
  mv "$stage" "$dest"
  echo "[bench-fetch] ready: nbls ($dest)" >&2
}

corpora=(
  "jackson-core|FasterXML/jackson-core|jackson-core-2.18.2"
  "gson|google/gson|gson-parent-2.11.0"
  "commons-lang|apache/commons-lang|rel/commons-lang-3.17.0"
  "ant-ivy|apache/ant-ivy|rel/2.5.2"
  "gradle-medium|remkop/picocli|v4.7.6"
  "tomcat|apache/tomcat|11.0.2"
  "junit-framework|junit-team/junit-framework|r5.11.4"
  "error-prone|google/error-prone|v2.36.0"
)

required_pids=()
optional_pids=()

if [ "${SERVERS_ONLY:-0}" != "1" ]; then
  for entry in "${corpora[@]}"; do
    IFS='|' read -r id slug tag <<< "$entry"
    if should_run "$id" "$@"; then
      fetch_corpus "$id" "$slug" "$tag" &
      required_pids+=("$!")
    fi
  done

  if should_run "plain-small" "$@"; then
    gen_plain_small &
    required_pids+=("$!")
  fi
fi

if [ "${CORPORA_ONLY:-0}" != "1" ]; then
  if should_run "jdtls" "$@"; then
    fetch_jdtls &
    optional_pids+=("jdtls:$!")
  fi
  if should_run "jls" "$@"; then
    fetch_jls &
    optional_pids+=("jls:$!")
  fi
  if should_run "nbls" "$@"; then
    fetch_nbls &
    optional_pids+=("nbls:$!")
  fi
fi

status=0
for pid in "${required_pids[@]}"; do
  if ! wait "$pid"; then
    status=1
  fi
done

for entry in "${optional_pids[@]}"; do
  sid="${entry%%:*}"
  pid="${entry#*:}"
  if ! wait "$pid"; then
    echo "[bench-fetch] warning: failed to fetch optional server '$sid'; continuing with available servers" >&2
  fi
done

exit "$status"
'''

[tasks.bench]
description = "Build release binaries, fetch benchmark assets, and run the LSP benchmark suite"
run = '''
#!/usr/bin/env bash
set -euo pipefail

cargo build --release -p java-analyzer -p xtask
mise run bench-fetch

args=(
  --server "java-analyzer=target/release/java-analyzer lsp"
)

if [ -x "target/bench/servers/jdtls/bin/jdtls" ]; then
  args+=(--server "jdtls=target/bench/servers/jdtls/bin/jdtls -data {cache_dir}")
elif command -v jdtls >/dev/null 2>&1; then
  args+=(--server "jdtls=$(command -v jdtls) -data {cache_dir}")
fi

case "$(uname -s)" in
  Darwin)
    jls_script="target/bench/servers/jls/extension/dist/lang_server_mac.sh"
    ;;
  *)
    jls_script="target/bench/servers/jls/extension/dist/lang_server_linux.sh"
    ;;
esac
if [ -x "$jls_script" ]; then
  args+=(--server "jls=$jls_script")
elif [ -x "target/bench/servers/jls/extension/dist/lang_server_mac.sh" ]; then
  args+=(--server "jls=target/bench/servers/jls/extension/dist/lang_server_mac.sh")
elif [ -x "target/bench/servers/jls/extension/dist/lang_server_linux.sh" ]; then
  args+=(--server "jls=target/bench/servers/jls/extension/dist/lang_server_linux.sh")
fi

if [ -x "target/bench/servers/nbls/extension/nbcode/bin/nbcode.sh" ]; then
  args+=(--server "nbls=target/bench/servers/nbls/extension/nbcode/bin/nbcode.sh --userdir {cache_dir} --start-java-language-server")
elif [ -x "target/bench/servers/nbls/extension/nbcode/bin/nbcode" ]; then
  args+=(--server "nbls=target/bench/servers/nbls/extension/nbcode/bin/nbcode --userdir {cache_dir} --start-java-language-server")
fi

has_explicit_repo=0
for arg in "$@"; do
  case "$arg" in
    --repo|--repo=*)
      has_explicit_repo=1
      break
      ;;
  esac
done

if [ "$has_explicit_repo" -eq 0 ]; then
  for id in plain-small jackson-core gson commons-lang ant-ivy gradle-medium tomcat junit-framework error-prone; do
    if [ -d "target/bench/corpus/$id" ]; then
      args+=(--repo "${id}=target/bench/corpus/${id}")
    fi
  done
fi

if command -v jj >/dev/null 2>&1; then
  rev="$(jj log -r @- --no-graph -T 'change_id.shortest(8) ++ " (" ++ commit_id.shortest(8) ++ ", " ++ description.first_line() ++ ")"' 2>/dev/null || echo "unknown")"
else
  rev="unknown"
fi
[ -n "$rev" ] || rev="unknown"

target/release/xtask bench \
  "${args[@]}" \
  --revision "$rev" \
  "$@"
'''
