[tools]
ast-grep = "latest"
fd = "latest"
jq = "latest"
jujutsu = "latest"
node = "lts"
ripgrep = "latest"
xh = "latest"
yq = "latest"

[tasks.conformance-fetch]
description = "Download and unpack pinned Java corpora using xh"
run = '''
#!/usr/bin/env bash
set -euo pipefail

corpus_dir="target/conformance/corpus"
mkdir -p "$corpus_dir"

tmp_root="$(mktemp -d "${TMPDIR:-/tmp}/java-corpus.XXXXXX")"
trap 'rm -rf "$tmp_root"' EXIT

fetch_tarball() {
  local id="$1"
  local url="$2"
  local subdir="$3"
  local dest="$corpus_dir/$id"
  local archive="$tmp_root/$id.tar.gz"

  if [ -d "$dest" ] && [ "${FORCE:-0}" != "1" ]; then
    echo "cached: $id ($dest)"
    return 0
  fi

  echo "[conformance] fetching $id..." >&2
  xh --quiet --ignore-stdin --download --follow --check-status --output "$archive" GET "$url" Accept-Encoding:gzip

  local stage="$tmp_root/$id"
  mkdir -p "$stage"
  tar -xzf "$archive" -C "$stage"
  rm -f "$archive"

  local top
  top="$(find "$stage" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
  if [ ! -d "$top/$subdir" ]; then
    echo "error: expected $subdir inside $id archive" >&2
    return 1
  fi

  rm -rf "$dest"
  mv "$top/$subdir" "$dest"
  echo "[conformance] ready: $id" >&2
}

pids=()
fetch_tarball \
  "commons-lang" \
  "https://github.com/apache/commons-lang/archive/refs/tags/rel/commons-lang-3.17.0.tar.gz" \
  "src/main/java" &
pids+=($!)

fetch_tarball \
  "jackson-core" \
  "https://github.com/FasterXML/jackson-core/archive/refs/tags/jackson-core-2.18.2.tar.gz" \
  "src/main/java" &
pids+=($!)

fetch_tarball \
  "guava" \
  "https://github.com/google/guava/archive/refs/tags/v33.4.0.tar.gz" \
  "guava/src" &
pids+=($!)

fetch_tarball \
  "google-java-format" \
  "https://github.com/google/google-java-format/archive/refs/tags/v1.24.0.tar.gz" \
  "core/src/main/java" &
pids+=($!)

status=0
for pid in "${pids[@]}"; do
  if ! wait "$pid"; then
    status=1
  fi
done
exit "$status"
'''

[tasks.conformance-fetch-jdk]
description = "Download and unpack OpenJDK source tree (arg or JDK_VERSION: latest|lts|<N>|<tag>)"
run = '''
#!/usr/bin/env bash
set -euo pipefail

spec="${1:-${JDK_TAG:-${JDK_VERSION:-latest}}}"
case "$spec" in
  latest)
    ver="$(xh --ignore-stdin --body --check-status GET https://api.adoptium.net/v3/info/available_releases | jq -r '.most_recent_feature_release')"
    jdk_tag="jdk-${ver}-ga"
    ;;
  lts)
    ver="$(xh --ignore-stdin --body --check-status GET https://api.adoptium.net/v3/info/available_releases | jq -r '.most_recent_lts')"
    jdk_tag="jdk-${ver}-ga"
    ;;
  *[!0-9]*)
    jdk_tag="$spec"
    ;;
  *)
    jdk_tag="jdk-${spec}-ga"
    ;;
esac

jdk_dir="target/conformance/jdk"
dest="$jdk_dir/$jdk_tag"
mkdir -p "$jdk_dir"

if [ -d "$dest" ] && [ "${FORCE:-0}" != "1" ]; then
  echo "cached: $jdk_tag ($dest)"
  exit 0
fi

tmp_root="$(mktemp -d "${TMPDIR:-/tmp}/java-corpus-jdk.XXXXXX")"
trap 'rm -rf "$tmp_root"' EXIT
archive="$tmp_root/$jdk_tag.tar.gz"

url="https://github.com/openjdk/jdk/archive/refs/tags/${jdk_tag}.tar.gz"
echo "[conformance] fetching $jdk_tag..." >&2
xh --quiet --ignore-stdin --download --follow --check-status --output "$archive" GET "$url" Accept-Encoding:gzip

# Extract only src/ so tests and build scripts don't bloat disk or skew valid-only results.
top_dir="jdk-${jdk_tag//+/-}"
tar -xzf "$archive" -C "$tmp_root" "$top_dir/src"
rm -f "$archive"

if [ ! -d "$tmp_root/$top_dir/src" ]; then
  echo "error: expected $top_dir/src inside $jdk_tag archive" >&2
  exit 1
fi

rm -rf "$dest"
mv "$tmp_root/$top_dir/src" "$dest"
echo "unpacked: $jdk_tag -> $dest"
'''

[tasks.conformance]
description = "Fetch library corpora and run parser conformance checks"
depends = ["conformance-fetch"]
run = '''
#!/usr/bin/env bash
set -euo pipefail

cleanup() {
  rm -rf target/conformance/archives target/conformance/corpus
}
trap cleanup EXIT

corpus_dir="target/conformance/corpus"
args=()
for dir in "$corpus_dir"/*; do
  if [ -d "$dir" ]; then
    args+=(--valid "$dir")
  fi
done

if [ -z "${args[*]:-}" ]; then
  echo "error: no corpora found in $corpus_dir" >&2
  exit 1
fi

cargo xtask conformance "${args[@]}" --out target/conformance
'''

[tasks.conformance-jdk]
description = "Fetch library corpora + OpenJDK (arg or JDK_VERSION: latest|lts|<N>|<tag>) and run conformance"
run = '''
#!/usr/bin/env bash
set -euo pipefail

jdk_log="$(mktemp "${TMPDIR:-/tmp}/java-corpus-jdk-log.XXXXXX")"
cleanup() {
  rm -rf target/conformance/archives target/conformance/corpus target/conformance/jdk "$jdk_log"
}
trap cleanup EXIT

mise run conformance-fetch &
pid_libs=$!
mise run conformance-fetch-jdk "$@" > "$jdk_log" &
pid_jdk=$!

status=0
wait "$pid_libs" || status=1
wait "$pid_jdk" || status=1
if [ "$status" -ne 0 ]; then
  cat "$jdk_log" >&2
  exit "$status"
fi

jdk_path="$(sed -nE 's/^.*(cached|unpacked): [^ ]+ (-> )?\(?([^)]+)\)?$/\3/p' "$jdk_log" | tail -n 1)"

if [ -z "$jdk_path" ] || [ ! -d "$jdk_path" ]; then
  echo "error: could not locate unpacked JDK corpus" >&2
  exit 1
fi

args=()
for dir in target/conformance/corpus/*; do
  if [ -d "$dir" ]; then
    args+=(--valid "$dir")
  fi
done
args+=(--valid "$jdk_path")

cargo xtask conformance "${args[@]}" --out target/conformance
'''

[tasks.workspace-corpus]
description = "Fetch, inspect, and clean up real-world Java repos in parallel (CORPUS_JOBS=4, optional filter args)"
run = '''
#!/usr/bin/env bash
set -euo pipefail

cargo build --release -p java-analyzer

bin="target/release/java-analyzer"
out_dir="target/workspace-corpus"
mkdir -p "$out_dir"

tmp_root="$(mktemp -d "${TMPDIR:-/tmp}/java-workspace-corpus.XXXXXX")"
mkdir -p "$tmp_root/timings"
trap 'rm -rf "$tmp_root"' EXIT

repos=(
  "commons-lang|apache/commons-lang"
  "gson|google/gson"
  "junit-framework|junit-team/junit-framework"
  "ant-ivy|apache/ant-ivy"
  "ant|apache/ant"
  "tomcat|apache/tomcat"
  "bach|sormuras/bach"
  "jbang-catalog|jbangdev/jbang-catalog"
  "checkstyle|checkstyle/checkstyle"
  "jackson-core|FasterXML/jackson-core"
  "error-prone|google/error-prone"
  "jfx|openjdk/jfx"
)

should_run() {
  local id="$1"
  if [ "$#" -lt 2 ]; then
    return 0
  fi
  shift
  for f in "$@"; do
    if [ "$f" = "$id" ]; then
      return 0
    fi
  done
  return 1
}

process_repo() {
  local id="$1"
  local slug="$2"
  local stage="$tmp_root/$id"
  local archive="$tmp_root/$id.tar.gz"
  mkdir -p "$stage"

  local url="https://github.com/${slug}/archive/HEAD.tar.gz"
  xh --quiet --ignore-stdin --download --follow --check-status --output "$archive" GET "$url" Accept-Encoding:gzip

  tar -xzf "$archive" -C "$stage"
  rm -f "$archive"

  local repo_dir
  repo_dir="$(fd --type d --max-depth 1 . "$stage" | head -n 1)"
  if [ -z "$repo_dir" ] || [ ! -d "$repo_dir" ]; then
    echo "error: failed to locate unpacked directory for $id" >&2
    rm -rf "$stage"
    return 1
  fi

  local start_ms end_ms elapsed_ms
  start_ms="$(python3 -c 'import time; print(int(time.time() * 1000))')"
  "$bin" inspect --json --show-errors "$repo_dir" > "$out_dir/$id.json"
  end_ms="$(python3 -c 'import time; print(int(time.time() * 1000))')"
  elapsed_ms="$((end_ms - start_ms))"
  printf '%s\n' "$elapsed_ms" > "$tmp_root/timings/$id.ms"

  rm -rf "$stage"
  echo "[workspace-corpus] $id done (${elapsed_ms}ms)" >&2
}

jobs="${CORPUS_JOBS:-4}"
selected_ids=()
pids=()
active=0
status=0

for entry in "${repos[@]}"; do
  id="${entry%%|*}"
  slug="${entry#*|}"
  if ! should_run "$id" "$@"; then
    continue
  fi
  selected_ids+=("$id")

  process_repo "$id" "$slug" &
  pids+=($!)
  active=$((active + 1))

  if [ "$active" -ge "$jobs" ]; then
    if ! wait -n; then
      status=1
    fi
    active=$((active - 1))
  fi
done

for pid in "${pids[@]}"; do
  if ! wait "$pid"; then
    status=1
  fi
done

if [ "$status" -ne 0 ]; then
  exit "$status"
fi

timing_file="$out_dir/timings.tsv"
: > "$timing_file"
for id in "${selected_ids[@]}"; do
  ms="$(cat "$tmp_root/timings/$id.ms")"
  printf '%s\t%s\n' "$id" "$ms" >> "$timing_file"
done

echo ""
{
  printf 'Repo\tBuild\tRelease\tModules\tFiles\tTypes\tParse Errors\tPkg Mismatches\tConflicts\tTime (ms)\n'
  while IFS=$'\t' read -r id ms; do
    jq -r --arg id "$id" --arg ms "$ms" '
      "\($id)\t\(.active_build_tool)\tJava \(.active_language_level.release)\t\(.modules | length)\t\(.health.total_java_files)\t\(.health.indexed_types)\t\(.health.files_with_parse_errors)\t\(.package_mismatches | length)\t\(.conflicts | length)\t\($ms)"
    ' "$out_dir/$id.json"
  done < "$timing_file"
} | awk -F'\t' '
  {
    for (i = 1; i <= NF; i++) {
      rows[NR, i] = $i
      if (length($i) > w[i]) w[i] = length($i)
    }
    cols = NF
  }
  END {
    for (r = 1; r <= NR; r++) {
      for (i = 1; i <= cols; i++) {
        sep = (i == cols) ? "\n" : "  "
        if (i <= 3) printf "%-*s%s", w[i], rows[r, i], sep
        else printf "%*s%s", w[i], rows[r, i], sep
      }
      if (r == 1) {
        for (i = 1; i <= cols; i++) {
          sep = (i == cols) ? "\n" : "  "
          dash = ""
          for (j = 0; j < w[i]; j++) dash = dash "-"
          printf "%s%s", dash, sep
        }
      }
    }
  }
'
'''

[tasks.conformance-report]
description = "Run all verification tiers (in parallel where possible) and generate CONFORMANCE.md"
run = '''
#!/usr/bin/env bash
set -euo pipefail

mkdir -p target/conformance

# Build release binaries once up front so parallel corpus runs don't contend on Cargo locks.
cargo build --release -p java-analyzer -p xtask

if cargo clippy --workspace --all-targets -- -D warnings; then
  clippy_status="pass"
else
  clippy_status="fail"
fi

cargo test --workspace --all-targets 2>&1 | tee target/conformance/test-output.txt || true

mise run conformance-jdk &
pid_conf=$!
mise run workspace-corpus &
pid_ws=$!

corpus_status=0
wait "$pid_conf" || corpus_status=1
wait "$pid_ws" || corpus_status=1
if [ "$corpus_status" -ne 0 ]; then
  exit "$corpus_status"
fi

if command -v jj >/dev/null 2>&1; then
  rev="$(jj log -r @- --no-graph -T 'change_id.shortest(8) ++ " (" ++ commit_id.shortest(8) ++ ", " ++ description.first_line() ++ ")"' 2>/dev/null || echo "unknown")"
else
  rev="unknown"
fi
[ -n "$rev" ] || rev="unknown"

cargo xtask report \
  --conformance target/conformance/report.json \
  --workspace-corpus target/workspace-corpus \
  --test-output target/conformance/test-output.txt \
  --clippy-status "$clippy_status" \
  --revision "$rev" \
  --out target/conformance/CONFORMANCE.md \
  "$@"
'''
